<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – HarshGuruJi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

<!-- PARTICLE CANVAS -->
<canvas id="particleCanvas"></canvas>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">HarshGuruJi</span>
    </a>
    <a href="index.html" class="btn btn-secondary">Back to Home</a>
  </div>
</nav>

<!-- SIGN UP FORM -->
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-glow"></div>
    <div class="auth-header">
      <div class="logo-icon" style="font-size: 2.5rem; margin-bottom: 0.5rem;">✦</div>
      <h2 class="section-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Create an <span class="gradient-text">Account</span></h2>
      <p class="section-desc" style="font-size: 0.95rem;">Join HarshGuruJi to start learning</p>
    </div>
    
    <form class="auth-form" action="#" method="POST">
      <div class="input-group">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>
      </div>
      
      <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Create a password" required />
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary auth-submit">
        <span>Sign Up</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Already have an account? <a href="#" class="auth-link">Log In</a></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
