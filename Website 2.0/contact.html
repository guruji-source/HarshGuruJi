<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - HarshGuruJi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <nav id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="logo.png" alt="HarshGuruJi Logo" style="height: 40px; width: auto; border-radius: 5px;" />
      </a>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html#home" class="nav-link">Home</a></li>
        <li><a href="index.html#features" class="nav-link">Features</a></li>
        <li><a href="index.html#categories" class="nav-link">Topics</a></li>
        <li><a href="index.html#ai" class="nav-link">GuruJi AI</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="contact.html" class="nav-link active">Contact</a></li>
      </ul>
      <div class="nav-search">
        <input type="text" id="site-search" placeholder="Search Wikipedia..." />
        <button id="search-btn">🔍</button>
      </div>
      <a href="signup.html" class="btn btn-nav">Join Us</a>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card" style="max-width: 600px;">
        <div class="auth-glow"></div>
        <div class="auth-header">
          <div class="badge" style="margin: 0 auto 1rem;">Get In Touch</div>
          <h2 class="section-title" style="font-size: 2.5rem;">Contact <span class="gradient-text">Us</span></h2>
          <p style="color: var(--text-secondary);">Have a question or feedback? We'd love to hear from you!</p>
        </div>
        <form class="auth-form" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
          <div class="input-group">
            <label>Name</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" placeholder="Your Name" required />
            </div>
          </div>
          <div class="input-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="input-group">
            <label>Message</label>
            <div class="input-wrapper">
              <span class="input-icon" style="top: 15px;">💬</span>
              <textarea placeholder="How can we help?" rows="4" style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1rem 1.5rem 1rem 45px; color: white; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif; resize: vertical;" required></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary auth-submit" style="width: 100%; padding: 1rem;">Send Message</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-glow"></div>
    <div class="footer-container">
      <div class="footer-bottom" style="justify-content: center;">
        <p>© 2026 HarshGuruJi – Tools & Learning Platform. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
