<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In – HarshGuruJi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

<!-- PARTICLE CANVAS -->
<canvas id="particleCanvas"></canvas>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">
      <img src="logo.png" alt="HarshGuruJi Logo" style="height: 40px; width: auto; border-radius: 5px;" />
    </a>
    <a href="index.html" class="btn btn-secondary">Back to Home</a>
  </div>
</nav>

<!-- LOG IN FORM -->
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-glow"></div>
    <div class="auth-header">
      <div class="logo-icon" style="font-size: 2.5rem; margin-bottom: 0.5rem;">✦</div>
      <h2 class="section-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome <span class="gradient-text">Back</span></h2>
      <p class="section-desc" style="font-size: 0.95rem;">Log in to access your dashboard</p>
    </div>
    
    <form class="auth-form" action="#" method="POST">
      <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
      </div>
      
      <div style="text-align: right; margin-bottom: 1.5rem;">
        <a href="#" class="auth-link" style="font-size: 0.85rem;">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn btn-primary auth-submit">
        <span>Log In</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <div class="divider"><span>OR</span></div>
      
      <button class="btn btn-google" type="button" onclick="alert('Google Login frontend ready! You can connect this to Firebase or NextAuth when you build your backend.')">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
        </svg>
        Continue with Google
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
